<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Prático - Auxílio Estudantil UTFPR</title>
  <meta name="description" content="Guia passo a passo completo sobre como solicitar o Auxílio Estudantil da UTFPR de forma simples, organizada e sem erros.">
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <!-- Container principal do App -->
  <div class="app-container">
    
    <!-- Barra Superior Mobile -->
    <header class="mobile-header">
      <button id="menuToggle" class="menu-toggle-btn" aria-label="Abrir Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <span class="mobile-logo-text">Guia UTFPR</span>
      <button id="themeToggleMobile" class="theme-toggle-btn" aria-label="Mudar Tema">
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
    </header>

    <!-- Overlay para fechar menu mobile -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Barra Lateral (Sidebar) -->
    <aside id="sidebar" class="sidebar">
      
      <!-- Cabeçalho da Sidebar -->
      <div class="sidebar-header">
        <div class="logo-area">
          <span class="badge-primary">UTFPR</span>
          <h2>Guia Prático</h2>
        </div>
        <p class="subtitle">Auxílio Estudantil</p>
      </div>

      <!-- Barra de Busca -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Pesquisar no guia..." aria-label="Pesquisar conteúdo">
        <button id="clearSearch" class="clear-search-btn" style="display: none;">&times;</button>
      </div>

      <!-- Links de Navegação -->
      <nav class="navigation-menu" id="navigationMenu">
        <!-- Inserido dinamicamente via JS -->
      </nav>

      <!-- Rodapé da Sidebar (Configurações) -->
      <div class="sidebar-footer">
        <button id="themeToggle" class="theme-btn" aria-label="Mudar Tema">
          <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <span>Alternar tema</span>
        </button>
      </div>

    </aside>

    <!-- Área de Conteúdo Principal -->
    <main class="main-content">
      
      <!-- Cabeçalho Interno (Breadcrumbs & Progress Tracker) -->
      <div class="content-header">
        <div class="breadcrumbs" id="breadcrumbs">
          <span>Início</span> &rsaquo; <span>Capa</span>
        </div>
        
        <!-- Indicador de progresso de leitura / checklist -->
        <div class="progress-container">
          <span class="progress-text" id="progressText">Progresso: 0%</span>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>
      </div>

      <!-- Wrapper das Páginas do Guia -->
      <article class="page-container" id="pageContainer">
        <!-- Renderizado dinamicamente via JS com animação de fade-in -->
      </article>

      <!-- Navegação Rápida de Páginas (Próxima/Anterior) -->
      <footer class="content-footer">
        <button id="prevBtn" class="nav-btn prev">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Anterior</span>
        </button>
        
        <button id="nextBtn" class="nav-btn next">
          <span>Próxima</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </footer>

    </main>

  </div>

  <!-- Banco de Dados do Guia (GUIA_DATA) -->
  <script src="js/data.js"></script>
  <!-- Lógica Principal da Aplicação -->
  <script src="js/app.js"></script>
</body>
</html>
